<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orion AR Experience</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- APP SCRIPTS -->

  <script src="./assets/js/audio-manager.js"></script>
  <script src="./assets/js/ui-manager.js"></script>
  <script src="./assets/js/tracking-manager.js"></script>
  <script src="./assets/js/intro-manager.js"></script>
  <script src="./assets/js/interaction-manager.js"></script>
  <script src="./assets/js/puzzle-manager.js"></script>
  <script src="./assets/js/app.js"></script>

  <!-- IMAGE TARGET -->

  <script>

    const onxrloaded = () => {

      console.log('XR LOADED')

      XR8.XrController.configure({

        imageTargetData:[{

          name: 'book',

          type: 'PLANAR',

          imagePath: './assets/targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,

            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })

      console.log('IMAGE TARGET CONFIGURED')
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener(
          'xrloaded',
          onxrloaded
        )

  </script>

  <style>

    body {

      margin: 0;
      overflow: hidden;
      background: black;

      font-family: Arial, sans-serif;
    }

    #debugPanel {

      position: fixed;

      left: 10px;
      right: 10px;
      bottom: 110px;

      max-height: 260px;

      overflow-y: auto;

      z-index: 999999;

      padding: 12px;

      border-radius: 12px;

      background:
        rgba(0,0,0,0.82);

      color:
        #6CFF9F;

      font-size: 12px;

      line-height: 1.45;

      font-family:
        monospace;

      pointer-events: none;

      white-space: pre-wrap;
    }

    /* =========================================
      SPLASH SCREEN
    ========================================= */

    #splashScreen {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 999999;

      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0;

      animation:
        splashFadeIn 0.9s ease forwards;
    }

    @keyframes splashFadeIn {

      to {

        opacity: 1;
      }
    }

    #splashBg {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transform: scale(1.02);
    }

    #splashOverlay {

      position: absolute;
      inset: 0;

      background:

        linear-gradient(
          to bottom,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.45)
        );
    }

    #splashContent {

      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      box-sizing: border-box;

      padding:
        0 28px;
    }

    /* =========================================
      SPACERS
    ========================================= */

    #topSpacer {

      flex: 1.4;
    }

    #middleSpacer {

      flex: 1;
    }

    #bottomSpacer {

      flex: 0.65;
    }

    /* =========================================
      BRANDING
    ========================================= */

    #brandingBlock {

      display: flex;
      flex-direction: column;
      align-items: center;

      opacity: 0;

      transform:
        translateY(18px);

      animation:
        brandingReveal 0.9s ease forwards;

      animation-delay: 0.35s;
    }

    @keyframes brandingReveal {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }

    #titleImage {

      height: 34vh;

      width: auto;

      max-width: 82vw;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 14px
          rgba(255,220,150,0.18)
        );
    }

    #subTitle {

      margin-top: 1.2vh;

      color:
        #b09e75;

      font-size:
        clamp(12px, 1.8vh, 18px);

      letter-spacing: 0.22em;

      font-weight: 500;

      text-transform: uppercase;

      opacity: 0.95;
    }

    /* =========================================
      BUTTON
    ========================================= */

    #startButton {

      border:
        1.5px solid
        rgba(176,158,117,0.9);

      background:
        transparent;

      color:
        #b09e75;

      padding:
        18px 42px;

      border-radius: 10px;

      font-size:
        clamp(16px, 2.1vh, 22px);

      letter-spacing: 0.12em;

      text-transform: uppercase;

      cursor: pointer;

      opacity: 0;

      transform:
        translateY(18px);

      animation:
        ctaReveal 0.8s ease forwards;

      animation-delay: 0.75s;

      transition:
        transform 0.18s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

      box-shadow:
        0 0 12px
        rgba(176,158,117,0.12);
    }

    @keyframes ctaReveal {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }

    #startButton:active {

      transform:
        scale(0.97);

      background:
        rgba(176,158,117,0.08);

      box-shadow:
        0 0 18px
        rgba(176,158,117,0.22);
    }


    /* =========================================
       STATUS UI
    ========================================= */

    #statusMessage {

      position: fixed;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 99999;

      padding:
        14px 24px;

      border-radius: 14px;

      background:
        rgba(10,15,20,0.72);

      border:
        1px solid
        rgba(180,220,255,0.25);

      color:
        rgba(220,240,255,0.92);

      font-size: 16px;

      letter-spacing: 0.05em;

      opacity: 0;

      transition: opacity 0.3s ease;

      pointer-events: none;
    }

    #statusMessage.visible {

      opacity: 1;
    }
       
    #fadeOverlay {

      position: fixed;

      inset: 0;

      background: black;

      opacity: 0;

      pointer-events: none;

      z-index: 9999999;

      transition:
        opacity 1s ease;
    }

    #fadeOverlay.visible {

      opacity: 1;
    }
 
    #debugPanel {

      position: fixed;

      left: 10px;
      right: 10px;
      bottom: 110px;

      max-height: 220px;

      overflow-y: auto;

      z-index: 999999;

      padding: 12px;

      border-radius: 12px;

      background:
        rgba(0,0,0,0.72);

      color:
        #7CFFB2;

      font-size: 12px;

      font-family:
        monospace;

      line-height: 1.45;

      pointer-events: none;

      white-space: pre-wrap;
    }

  </style>
</head>

<body>

  <div id="statusMessage"></div>

  <!-- SPLASH -->

  <div id="splashContent">

    <div id="topSpacer"></div>

    <div id="brandingBlock">

      <img
        id="titleImage"
        src="./assets/title.png"
        alt="The Ghost City">

      <div id="subTitle">
        CLASSIFIED ARCHIVE ACCESS
      </div>

    </div>

    <div id="middleSpacer"></div>

    <button id="startButton">

      START EXPERIENCE

    </button>

    <div id="bottomSpacer"></div>

  </div>

  <!-- STATUS MESSAGE -->

  <div id="statusMessage"></div>
 
  <div id="fadeOverlay"></div>

  <!-- SCENE -->

  <a-scene

    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ASSETS -->

    <a-assets>

      <video
        id="introVideo"

        src="./assets/intro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <video
        id="outroVideo"

        src="./assets/outro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <a-asset-item

        id="lockerAsset"

        src="./assets/locker.glb">
      </a-asset-item>

    </a-assets>
        
    <!-- AMBIENT LIGHT -->

    <a-light

      type="ambient"

      color="#ffffff"

      intensity="2.2">
    </a-light>

    <!-- DIRECTIONAL LIGHT -->

    <a-light

      type="directional"

      color="#ffffff"

      intensity="2.5"

      position="2 4 3">
    </a-light>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- IMAGE TARGET -->

    <xrextras-named-image-target name="book">

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="0.75"
        height="1.132"

        position="0 0 0"

        visible="false">
      </a-video>

      <!-- LOCKER MODEL -->

      <a-entity

        id="lockerModel"

        gltf-model="#lockerAsset"

        position="0 0 0"

        rotation="0 -90 0"

        scale="1.25 1.25 1.25"

        visible="false">
      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="0.75"
        height="1.132"

        position="0 0.3 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

</body>
</html>
