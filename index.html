<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR BOOK</title>

  <!-- AR Libraries -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- 8th Wall Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target Configuration -->
  <script>
    const onxrloaded = () => {
      XR8.XrController.configure({
        imageTargetData:[{
          "name": "book",
          "type": "PLANAR",
          "imagePath": "../assets/Targets/ghost_book_luminance.jpg",
          "properties": {
            "top": 184,
            "left": 0,
            "width": 2083,
            "height": 2777,
            "isRotated": false,
            "originalWidth": 2083,
            "originalHeight": 3144
          }
        }]
      });
    };
    window.XR8 ? onxrloaded() : window.addEventListener('xrloaded', onxrloaded);
  </script>
  
  <script src="./locker-puzzle.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #statusText {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      color: white;
      background: rgba(0,0,0,0.75);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 18px;
      display: none;
    }
  </style>
</head>

<body>

<div id="statusText">Puzzle Solved</div>

<a-scene
  xrextras-gesture-detector
  xrextras-almost-there
  xrextras-loading
  xrextras-runtime-error
  xrweb="disableWorldTracking: true">

  <a-assets>
    <!-- Videos -->
    <video
      id="introVideo"
      src="assets/intro_video.mp4"
      preload="auto"
      webkit-playsinline
      playsinline
      crossorigin="anonymous">
    </video>

    <video
      id="outroVideo"
      src="assets/outro_video.mp4"
      preload="auto"
      webkit-playsinline
      playsinline
      crossorigin="anonymous">
    </video>

    <!-- Replace with your actual model -->
    <a-asset-item id="lockerModel" src="assets/locker.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 4 10"></a-camera>

  <xrextras-named-image-target name="book">

    <!-- INTRO VIDEO -->
    <a-video
      id="introPlane"
      src="#introVideo"
      width="1.5"
      height="0.85"
      position="0 0.3 0">
    </a-video>

    <!-- LOCKER -->
    <a-entity
      id="lockerRoot"
      gltf-model="#lockerModel"
      position="0 0 0"
      scale="0.5 0.5 0.5"
      visible="false"
      locker-puzzle>
    </a-entity>

    <!-- OUTRO VIDEO -->
    <a-video
      id="outroPlane"
      src="#outroVideo"
      width="1.5"
      height="0.85"
      position="0 0.3 0"
      visible="false">
    </a-video>

  </xrextras-named-image-target>

</a-scene>

<script>
  const introVideo = document.querySelector('#introVideo')
  const outroVideo = document.querySelector('#outroVideo')

  const introPlane = document.querySelector('#introPlane')
  const outroPlane = document.querySelector('#outroPlane')

  const lockerRoot = document.querySelector('#lockerRoot')

  const statusText = document.querySelector('#statusText')

  function showMessage(text) {
    statusText.innerText = text
    statusText.style.display = 'block'

    setTimeout(() => {
      statusText.style.display = 'none'
    }, 2500)
  }

  // Start intro video once target is found
  document.querySelector('xrextras-named-image-target')
    .addEventListener('targetFound', () => {

      introPlane.setAttribute('visible', true)

      introVideo.play().catch(() => {})
    })

  introVideo.addEventListener('ended', () => {
    introPlane.setAttribute('visible', false)

    lockerRoot.setAttribute('visible', true)
  })

  // Global callback from puzzle component
  window.onPuzzleSolved = (type) => {

    if(type === 'top') {
      showMessage('Top Code Solved : 11235')
    }

    if(type === 'bottom') {
      showMessage('Bottom Code Solved : 81321')
    }

    lockerRoot.setAttribute('visible', false)

    outroPlane.setAttribute('visible', true)

    outroVideo.play().catch(() => {})
  }
</script>

</body>
</html>
