<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR MODEL TEST</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- IMAGE TARGET -->

  <script>

    const onxrloaded = () => {

      console.log('XR LOADED')

      XR8.XrController.configure({

        imageTargetData:[{

          name: 'book',

          type: 'PLANAR',

          imagePath: './assets/targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,

            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })

      console.log('IMAGE TARGET CONFIGURED')
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener(
          'xrloaded',
          onxrloaded
        )

  </script>

  <!-- SIMPLE FLOW -->

  <script>

    AFRAME.registerComponent(
      'simple-ar-flow',

      {

        // ====================================
        // TOUCH RAYCAST
        // ====================================

        onTouch(event) {

          console.log('TOUCH DETECTED')

          if (!this.modelVisible) {

            console.log(
              'MODEL NOT VISIBLE'
            )

            return
          }

          const touch =
            event.touches[0]

          this.mouse.x =
            (touch.clientX / window.innerWidth) * 2 - 1

          this.mouse.y =
            -(touch.clientY / window.innerHeight) * 2 + 1

          console.log(
            'NORMALIZED TOUCH:',
            this.mouse
          )

          this.raycaster.setFromCamera(

            this.mouse,

            this.camera.object3D.children[0]
          )

          const modelMesh =
            this.model.getObject3D('mesh')

          if (!modelMesh) {

            console.log(
              'NO MODEL MESH'
            )

            return
          }

          const intersects =
            this.raycaster.intersectObject(
              modelMesh,
              true
            )

          console.log(
            'INTERSECTIONS:',
            intersects
          )

          if (!intersects.length) {

            console.log(
              'NO MODEL HIT'
            )

            return
          }

          console.log('MODEL TOUCHED')

          this.model.setAttribute(
            'visible',
            false
          )

          this.modelVisible = false

          this.outroPlane.setAttribute(
            'visible',
            true
          )

          this.outroVideo.play()

          console.log(
            'OUTRO STARTED'
          )
        },

        // ====================================
        // INIT
        // ====================================

        init: function () {

          console.log(
            'FLOW COMPONENT INIT'
          )

          this.introVideo =
            document.querySelector(
              '#introVideo'
            )

          this.outroVideo =
            document.querySelector(
              '#outroVideo'
            )

          this.introPlane =
            document.querySelector(
              '#introPlane'
            )

          this.outroPlane =
            document.querySelector(
              '#outroPlane'
            )

          this.model =
            document.querySelector(
              '#lockerModel'
            )

          this.started = false

          // ====================================
          // RAYCAST SETUP
          // ====================================

          this.camera =
            document.querySelector('[camera]')

          this.raycaster =
            new THREE.Raycaster()

          this.mouse =
            new THREE.Vector2()

          this.modelVisible = false

          this.onTouch =
            this.onTouch.bind(this)

          window.addEventListener(
            'touchstart',
            this.onTouch,
            { passive: false }
          )

          console.log(
            'RAYCAST TOUCH READY'
          )

          // ====================================
          // TARGET FOUND
          // ====================================

          this.onFound = () => {

            console.log('===================')
            console.log('TARGET FOUND')
            console.log('===================')

            if (this.started) return

            this.started = true

            this.introPlane.setAttribute(
              'visible',
              true
            )

            this.introVideo.play()

            console.log(
              'INTRO VIDEO STARTED'
            )
          }

          // ====================================
          // TARGET LOST
          // ====================================

          this.onLost = () => {

            console.log('===================')
            console.log('TARGET LOST')
            console.log('===================')

            this.introVideo.pause()

            this.outroVideo.pause()
          }

          // ====================================
          // INTRO ENDED
          // ====================================

          this.introVideo.addEventListener(
            'ended',

            () => {

              console.log(
                'INTRO VIDEO ENDED'
              )

              this.introPlane.setAttribute(
                'visible',
                false
              )

              this.model.setAttribute(
                'visible',
                true
              )

              this.modelVisible = true

              console.log(
                'MODEL SHOWN'
              )
            }
          )

          // ====================================
          // XR EVENTS
          // ====================================

          this.el.sceneEl.addEventListener(
            'xrimagefound',
            this.onFound
          )

          this.el.sceneEl.addEventListener(
            'xrimagelost',
            this.onLost
          )

          console.log(
            'XR EVENTS REGISTERED'
          )
        }
      }
    )

  </script>

  <!-- STYLES -->

  <style>

    body {

      margin: 0;
      overflow: hidden;
      background: black;

      font-family: Arial, sans-serif;
    }

    /* =========================================
       SPLASH SCREEN
    ========================================= */

    #splashScreen {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 999999;

      background: #000;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        "Arial",
        sans-serif;
    }

    /* =========================================
       BACKGROUND IMAGE
    ========================================= */

    #splashBg {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      pointer-events: none;
    }

    /* =========================================
       DARK OVERLAY
    ========================================= */

    #splashOverlay {

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.25),
          rgba(0,0,0,0.55)
        );

      pointer-events: none;
    }

    /* =========================================
       CONTENT
    ========================================= */

    #splashContent {

      position: relative;

      z-index: 5;

      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      padding:
        0 32px;

      box-sizing: border-box;

      text-align: center;
    }

    /* =========================================
       MAIN TITLE
    ========================================= */

    #mainTitle {

      margin: 0;

      color: white;

      font-size:
        clamp(48px, 9vw, 88px);

      font-weight: 800;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      line-height: 0.95;

      text-shadow:
        0 0 20px rgba(255,255,255,0.25),
        0 0 50px rgba(120,200,255,0.15);
    }

    /* =========================================
       SUB TITLE
    ========================================= */

    #subTitle {

      margin-top: 18px;

      color:
        rgba(220,235,255,0.82);

      font-size:
        clamp(18px, 3vw, 32px);

      letter-spacing: 0.18em;

      font-weight: 300;

      text-transform: uppercase;

      opacity: 0.9;
    }

    /* =========================================
       START BUTTON
    ========================================= */

    #startButton {

      margin-top: 90px;

      width: min(82vw, 420px);

      height: 74px;

      border-radius: 18px;

      border:
        1.5px solid
        rgba(190,230,255,0.7);

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.18),
          rgba(120,170,220,0.12)
        );

      backdrop-filter:
        blur(10px);

      color: white;

      font-size: 30px;

      font-weight: 300;

      letter-spacing: 0.08em;

      cursor: pointer;

      transition:
        transform 0.2s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

      box-shadow:
        0 0 18px rgba(180,220,255,0.28),
        inset 0 0 12px rgba(255,255,255,0.08);
    }

    #startButton:active {

      transform: scale(0.97);
    }

    #startButton:disabled {

      opacity: 0.7;
    }

    /* =========================================
       HELPER TEXT
    ========================================= */

    #helperText {

      margin-top: 26px;

      color:
        rgba(220,230,255,0.65);

      font-size: 18px;

      letter-spacing: 0.05em;

      font-weight: 300;
    }

    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 768px) {

      #mainTitle {

        font-size: 64px;
      }

      #subTitle {

        font-size: 18px;
      }

      #startButton {

        height: 64px;

        font-size: 24px;

        margin-top: 70px;
      }

      #helperText {

        font-size: 15px;
      }
    }

  </style>
</head>

<body>

  <!-- SPLASH -->

  <div id="splashScreen">

    <img
      id="splashBg"
      src="./assets/splash_bg.jpg">

    <div id="splashOverlay"></div>

    <div id="splashContent">

      <h1 id="mainTitle">
        THE GHOST CITY
      </h1>

      <p id="subTitle">
        Classified Archive Access
      </p>

      <button id="startButton">

        Start Experience

      </button>

    </div>

  </div>

  <!-- SCENE -->

  <a-scene

    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ASSETS -->

    <a-assets>

      <!-- INTRO VIDEO -->

      <video
        id="introVideo"

        src="./assets/intro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <!-- OUTRO VIDEO -->

      <video
        id="outroVideo"

        src="./assets/outro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <!-- MODEL -->

      <a-asset-item

        id="lockerAsset"

        src="./assets/locker.glb">
      </a-asset-item>

    </a-assets>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- IMAGE TARGET -->

    <xrextras-named-image-target

      name="book"

      simple-ar-flow>

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

      <!-- MODEL -->

      <a-entity

        id="lockerModel"

        gltf-model="#lockerAsset"

        position="0 -0.4 0"

        scale="0.3 0.3 0.3"

        visible="false">

      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

  <!-- SPLASH LOGIC -->

  <script>

    console.log('APP START')

    let experienceStarted = false

    const splashScreen =
      document.querySelector(
        '#splashScreen'
      )

    const startButton =
      document.querySelector(
        '#startButton'
      )

    const introVideo =
      document.querySelector(
        '#introVideo'
      )

    startButton.addEventListener(

      'click',

      async () => {

        console.log(
          'START BUTTON CLICKED'
        )

        if (experienceStarted) {

          console.log(
            'EXPERIENCE ALREADY STARTED'
          )

          return
        }

        experienceStarted = true

        startButton.innerText =
          'LOADING...'

        startButton.disabled = true

        try {

          await introVideo.play()

          introVideo.pause()

          introVideo.currentTime = 0

          console.log(
            'MEDIA UNLOCK SUCCESS'
          )

        } catch (e) {

          console.log(
            'MEDIA UNLOCK FAILED'
          )

          console.error(e)
        }

        splashScreen.style.display =
          'none'

        console.log(
          'SPLASH HIDDEN'
        )
      }
    )

  </script>

</body>
</html>
