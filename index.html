<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Orion AR Experience</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- APP SCRIPTS -->

  <script src="./assets/js/audio-manager.js"></script>
  <script src="./assets/js/ui-manager.js"></script>
  <script src="./assets/js/tracking-manager.js"></script>
  <script src="./assets/js/intro-manager.js"></script>
  <script src="./assets/js/interaction-manager.js"></script>
  <script src="./assets/js/puzzle-manager.js"></script>
  <script src="./assets/js/app.js"></script>

  <!-- IMAGE TARGET -->

  <script>

    const onxrloaded = () => {

      console.log('XR LOADED')

      XR8.XrController.configure({

        imageTargetData:[{

          name: 'book',

          type: 'PLANAR',

          imagePath: './assets/targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,

            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })

      console.log('IMAGE TARGET CONFIGURED')
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener(
          'xrloaded',
          onxrloaded
        )

  </script>

  <style>

    body {

      margin: 0;
      overflow: hidden;
      background: black;

      font-family: Arial, sans-serif;
    }

    /* =========================================
       SPLASH SCREEN
    ========================================= */

    #splashScreen {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 999999;

      background: #000;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    #splashBg {

      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    #splashOverlay {

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,0.25),
          rgba(0,0,0,0.55)
        );
    }

    #splashContent {

      position: relative;

      z-index: 5;

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;

      padding:
        90px 32px 60px;

      box-sizing: border-box;

      text-align: center;
    }

    #titleWrapper {

      margin-top: 120px;
    }

    #mainTitle {

      margin: 0;

      color: white;

      font-size:
        clamp(48px, 9vw, 88px);

      font-weight: 800;

      letter-spacing: 0.08em;

      text-transform: uppercase;

      line-height: 0.95;
    }

    #subTitle {

      margin-top: 18px;

      color:
        rgba(220,235,255,0.82);

      font-size:
        clamp(18px, 3vw, 32px);

      letter-spacing: 0.18em;

      font-weight: 300;

      text-transform: uppercase;
    }

    #startButton {

      margin-bottom: 20px;

      width: min(82vw, 420px);

      height: 74px;

      border-radius: 18px;

      border:
        1.5px solid
        rgba(190,230,255,0.7);

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.18),
          rgba(120,170,220,0.12)
        );

      color: white;

      font-size: 30px;

      font-weight: 300;

      letter-spacing: 0.08em;

      cursor: pointer;
    }

    /* =========================================
       STATUS UI
    ========================================= */

    #statusMessage {

      position: fixed;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 99999;

      padding:
        14px 24px;

      border-radius: 14px;

      background:
        rgba(10,15,20,0.72);

      border:
        1px solid
        rgba(180,220,255,0.25);

      color:
        rgba(220,240,255,0.92);

      font-size: 16px;

      letter-spacing: 0.05em;

      opacity: 0;

      transition: opacity 0.3s ease;

      pointer-events: none;
    }

    #statusMessage.visible {

      opacity: 1;
    }

  </style>
</head>

<body>

  <!-- SPLASH -->

  <div id="splashScreen">

    <img
      id="splashBg"
      src="./assets/splash_bg.jpg">

    <div id="splashOverlay"></div>

    <div id="splashContent">

      <div id="titleWrapper">

        <h1 id="mainTitle">
          THE GHOST CITY
        </h1>

        <p id="subTitle">
          Classified Archive Access
        </p>

      </div>

      <button id="startButton">

        Start Experience

      </button>

    </div>

  </div>

  <!-- STATUS MESSAGE -->

  <div id="statusMessage"></div>

  <!-- SCENE -->

  <a-scene

    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ASSETS -->

    <a-assets>

      <video
        id="introVideo"

        src="./assets/intro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <video
        id="outroVideo"

        src="./assets/outro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <a-asset-item

        id="lockerAsset"

        src="./assets/locker.glb">
      </a-asset-item>

    </a-assets>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- IMAGE TARGET -->

    <xrextras-named-image-target name="book">

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

      <!-- LOCKER MODEL -->

      <a-entity

        id="lockerModel"

        gltf-model="#lockerAsset"

        position="0 0 0"

        rotation="0 -90 0"

        scale="2.3 2.3 2.3"

        visible="false">
      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

</body>
</html>
