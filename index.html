<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR MODEL TEST</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- IMAGE TARGET -->

  <script>

    const onxrloaded = () => {

      console.log('XR LOADED')

      XR8.XrController.configure({

        imageTargetData:[{

          name: 'book',

          type: 'PLANAR',

          imagePath: './assets/targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,

            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })

      console.log('IMAGE TARGET CONFIGURED')
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener(
          'xrloaded',
          onxrloaded
        )

  </script>

  <!-- SIMPLE FLOW -->

  <script>

    AFRAME.registerComponent(
      'simple-ar-flow',

      {

        // ====================================
        // TOUCH RAYCAST
        // ====================================

        onTouch(event) {

          console.log('TOUCH DETECTED')

          if (!this.modelVisible) {

            console.log(
              'MODEL NOT VISIBLE'
            )

            return
          }

          const touch =
            event.touches[0]

          this.mouse.x =
            (touch.clientX / window.innerWidth) * 2 - 1

          this.mouse.y =
            -(touch.clientY / window.innerHeight) * 2 + 1

          console.log(
            'NORMALIZED TOUCH:',
            this.mouse
          )

          this.raycaster.setFromCamera(

            this.mouse,

            this.camera.object3D.children[0]
          )

          const modelMesh =
            this.model.getObject3D('mesh')

          if (!modelMesh) {

            console.log(
              'NO MODEL MESH'
            )

            return
          }

          const intersects =
            this.raycaster.intersectObject(
              modelMesh,
              true
            )

          console.log(
            'INTERSECTIONS:',
            intersects
          )

          if (!intersects.length) {

            console.log(
              'NO MODEL HIT'
            )

            return
          }

          console.log('MODEL TOUCHED')

          // HIDE MODEL

          this.model.setAttribute(
            'visible',
            false
          )

          this.modelVisible = false

          // SHOW OUTRO

          this.outroPlane.setAttribute(
            'visible',
            true
          )

          this.outroVideo.play()

          console.log(
            'OUTRO STARTED'
          )
        },

        // ====================================
        // INIT
        // ====================================

        init: function () {

          console.log(
            'FLOW COMPONENT INIT'
          )

          this.introVideo =
            document.querySelector(
              '#introVideo'
            )

          this.outroVideo =
            document.querySelector(
              '#outroVideo'
            )

          this.introPlane =
            document.querySelector(
              '#introPlane'
            )

          this.outroPlane =
            document.querySelector(
              '#outroPlane'
            )

          this.model =
            document.querySelector(
              '#lockerModel'
            )

          this.started = false

          // ====================================
          // RAYCAST SETUP
          // ====================================

          this.camera =
            document.querySelector('[camera]')

          this.raycaster =
            new THREE.Raycaster()

          this.mouse =
            new THREE.Vector2()

          this.modelVisible = false

          this.onTouch =
            this.onTouch.bind(this)

          window.addEventListener(
            'touchstart',
            this.onTouch,
            { passive: false }
          )

          console.log(
            'RAYCAST TOUCH READY'
          )

          // ====================================
          // TARGET FOUND
          // ====================================

          this.onFound = () => {

            console.log('===================')
            console.log('TARGET FOUND')
            console.log('===================')

            if (this.started) return

            this.started = true

            this.introPlane.setAttribute(
              'visible',
              true
            )

            this.introVideo.play()

            console.log(
              'INTRO VIDEO STARTED'
            )
          }

          // ====================================
          // TARGET LOST
          // ====================================

          this.onLost = () => {

            console.log('===================')
            console.log('TARGET LOST')
            console.log('===================')

            this.introVideo.pause()

            this.outroVideo.pause()
          }

          // ====================================
          // INTRO ENDED
          // ====================================

          this.introVideo.addEventListener(
            'ended',

            () => {

              console.log(
                'INTRO VIDEO ENDED'
              )

              this.introPlane.setAttribute(
                'visible',
                false
              )

              this.model.setAttribute(
                'visible',
                true
              )

              this.modelVisible = true

              console.log(
                'MODEL SHOWN'
              )
            }
          )

          // ====================================
          // XR EVENTS
          // ====================================

          this.el.sceneEl.addEventListener(
            'xrimagefound',
            this.onFound
          )

          this.el.sceneEl.addEventListener(
            'xrimagelost',
            this.onLost
          )

          console.log(
            'XR EVENTS REGISTERED'
          )
        }
      }
    )

  </script>

  <!-- STYLES -->

  <style>

    body {

      margin: 0;
      overflow: hidden;
      background: black;

      font-family: Arial, sans-serif;
    }

    #splashScreen {

      position: fixed;
      inset: 0;

      z-index: 999999;

      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;
    }

    #splashContent {

      text-align: center;
    }

    #startButton {

      margin-top: 20px;

      padding: 16px 30px;

      border: none;
      border-radius: 10px;

      font-size: 18px;

      cursor: pointer;
    }

  </style>
</head>

<body>

  <!-- SPLASH -->

  <div id="splashScreen">

    <div id="splashContent">

      <h1>ORION</h1>

      <p>Scan the book to begin</p>

      <button id="startButton">

        START EXPERIENCE

      </button>

    </div>

  </div>

  <!-- SCENE -->

  <a-scene

    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ASSETS -->

    <a-assets>

      <!-- INTRO VIDEO -->

      <video
        id="introVideo"

        src="./assets/intro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <!-- OUTRO VIDEO -->

      <video
        id="outroVideo"

        src="./assets/outro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"

        muted>
      </video>

      <!-- MODEL -->

      <a-asset-item

        id="lockerAsset"

        src="./assets/locker.glb">
      </a-asset-item>

    </a-assets>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- IMAGE TARGET -->

    <xrextras-named-image-target

      name="book"

      simple-ar-flow>

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

      <!-- MODEL -->

      <a-entity

        id="lockerModel"

        gltf-model="#lockerAsset"

        position="0 -0.4 0"

        scale="0.3 0.3 0.3"

        visible="false">

      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

  <!-- SPLASH LOGIC -->

  <script>

    console.log('APP START')

    const splashScreen =
      document.querySelector(
        '#splashScreen'
      )

    const startButton =
      document.querySelector(
        '#startButton'
      )

    const introVideo =
      document.querySelector(
        '#introVideo'
      )

    startButton.addEventListener(

      'click',

      async () => {

        console.log(
          'START BUTTON CLICKED'
        )

        try {

          await introVideo.play()

          introVideo.pause()

          introVideo.currentTime = 0

          console.log(
            'MEDIA UNLOCK SUCCESS'
          )

        } catch (e) {

          console.log(
            'MEDIA UNLOCK FAILED'
          )

          console.error(e)
        }

        splashScreen.style.display =
          'none'

        console.log(
          'SPLASH HIDDEN'
        )
      }
    )

  </script>

</body>
</html>
