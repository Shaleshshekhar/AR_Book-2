<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR BOOK</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target -->
  <script>
    const onxrloaded = () => {

      XR8.XrController.configure({

        imageTargetData: [{

          name: 'book',
          type: 'PLANAR',

          imagePath: '../assets/Targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,
            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener('xrloaded', onxrloaded)
  </script>

  <!-- Puzzle Logic -->
  <script src="./locker-puzzle.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }

    /* ========================================= */
    /* SPLASH SCREEN */
    /* ========================================= */

    #splashScreen {

      position: fixed;
      inset: 0;

      z-index: 999999;

      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;

      pointer-events: auto;
    }

    #splashContent {
      text-align: center;
      padding: 30px;
      width: 100%;
    }

    #splashTitle {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }

    #splashSubtitle {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    #startButton {

      pointer-events: auto;

      border: none;
      outline: none;

      padding: 18px 34px;

      font-size: 18px;
      border-radius: 12px;

      background: white;
      color: black;

      cursor: pointer;

      position: relative;
      z-index: 999999;
    }

    /* ========================================= */
    /* STATUS TEXT */
    /* ========================================= */

    #statusText {

      position: fixed;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      color: white;

      background: rgba(0,0,0,0.75);

      padding: 12px 20px;

      border-radius: 10px;

      font-size: 18px;

      display: none;
    }

  </style>
</head>

<body>

  <!-- ========================================= -->
  <!-- SPLASH SCREEN -->
  <!-- ========================================= -->

  <div id="splashScreen">

    <div id="splashContent">

      <div id="splashTitle">
        ORION
      </div>

      <div id="splashSubtitle">
        Scan the book to begin the experience
      </div>

      <button id="startButton">
        START EXPERIENCE
      </button>

    </div>

  </div>

  <!-- ========================================= -->
  <!-- STATUS -->
  <!-- ========================================= -->

  <div id="statusText">
    Puzzle Solved
  </div>

  <!-- ========================================= -->
  <!-- SCENE -->
  <!-- ========================================= -->

  <a-scene

    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ========================================= -->
    <!-- ASSETS -->
    <!-- ========================================= -->

    <a-assets>

      <!-- INTRO VIDEO -->

      <video
        id="introVideo"
        src="assets/intro_video.mp4"
        preload="auto"
        webkit-playsinline
        playsinline
        crossorigin="anonymous"
        muted>
      </video>

      <!-- OUTRO VIDEO -->

      <video
        id="outroVideo"
        src="assets/outro_video.mp4"
        preload="auto"
        webkit-playsinline
        playsinline
        crossorigin="anonymous"
        muted>
      </video>

      <!-- LOCKER MODEL -->

      <a-asset-item
        id="lockerModel"
        src="assets/locker.glb">
      </a-asset-item>

    </a-assets>

    <!-- CAMERA -->

    <a-camera position="0 0 0"></a-camera>

    <!-- ========================================= -->
    <!-- IMAGE TARGET -->
    <!-- ========================================= -->

    <xrextras-named-image-target name="book">

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

      <!-- LOCKER -->

      <a-entity

        id="lockerRoot"

        gltf-model="#lockerModel"

        position="0 0 -0.3"

        scale="0.825 0.825 0.825"

        visible="false"

        locker-puzzle>
      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

  <!-- ========================================= -->
  <!-- MAIN EXPERIENCE SCRIPT -->
  <!-- ========================================= -->

  <script>

    const splashScreen = document.querySelector('#splashScreen')
    const startButton = document.querySelector('#startButton')

    const introVideo = document.querySelector('#introVideo')
    const outroVideo = document.querySelector('#outroVideo')

    const introPlane = document.querySelector('#introPlane')
    const outroPlane = document.querySelector('#outroPlane')

    const lockerRoot = document.querySelector('#lockerRoot')

    const statusText = document.querySelector('#statusText')

    const imageTarget =
      document.querySelector('xrextras-named-image-target')

    let experienceStarted = false

    let introCompleted = false
    let outroStarted = false

    // =========================================
    // STATUS MESSAGE
    // =========================================

    function showMessage(text) {

      statusText.innerText = text

      statusText.style.display = 'block'

      setTimeout(() => {

        statusText.style.display = 'none'

      }, 2500)
    }

    // =========================================
    // START EXPERIENCE
    // =========================================

    const unlockExperience = async () => {

      if (experienceStarted) return

      experienceStarted = true

      startButton.innerText = 'LOADING...'

      try {

        introVideo.muted = false
        outroVideo.muted = false

        await introVideo.play()

        introVideo.pause()

        introVideo.currentTime = 0

      } catch (e) {

        console.log('Media unlock handled')
      }

      splashScreen.style.display = 'none'

      window.puzzleTrackingActive = true
    }

    startButton.addEventListener('click', unlockExperience)
    startButton.addEventListener('touchstart', unlockExperience)

    // =========================================
    // TARGET FOUND
    // =========================================

    imageTarget.addEventListener('targetFound', () => {

      if (!experienceStarted) return

      window.puzzleTrackingActive = true

      // INTRO
      if (!introCompleted) {

        introPlane.setAttribute('visible', true)

        introVideo.play().catch(() => {})
      }

      // OUTRO
      if (introCompleted && outroStarted) {

        outroVideo.play().catch(() => {})
      }
    })

    // =========================================
    // TARGET LOST
    // =========================================

    imageTarget.addEventListener('targetLost', () => {

      introVideo.pause()
      outroVideo.pause()

      window.puzzleTrackingActive = false
    })

    // =========================================
    // INTRO ENDED
    // =========================================

    introVideo.addEventListener('ended', () => {

      introCompleted = true

      introPlane.setAttribute('visible', false)

      lockerRoot.setAttribute('visible', true)
    })

    // =========================================
    // SINGLE ROW SOLVED
    // =========================================

    window.onPuzzleSolved = (type) => {

      if (type === 'top') {

        showMessage('Dr. Ringuet Code Solved')
      }

      if (type === 'bottom') {

        showMessage('Saran Security Code Solved')
      }
    }

    // =========================================
    // ALL SOLVED
    // =========================================

    window.onAllPuzzleSolved = () => {

      showMessage('Locker Unlocked')

      lockerRoot.setAttribute('visible', false)

      outroStarted = true

      outroPlane.setAttribute('visible', true)

      outroVideo.play().catch(() => {})
    }

    // =========================================
    // OUTRO COMPLETE
    // =========================================

    outroVideo.addEventListener('ended', () => {

      window.location.href =
        'https://www.ryanpote.com/memento-mori'
    })

  </script>

</body>
</html>
