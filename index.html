<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Ghost City AR Experience</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
 
  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- APP SCRIPTS -->

  <script src="./assets/js/audio-manager.js"></script>
  <script src="./assets/js/ui-manager.js"></script>
  <script src="./assets/js/tracking-manager.js"></script>
  <script src="./assets/js/intro-manager.js"></script>
  <script src="./assets/js/interaction-manager.js"></script>
  <script src="./assets/js/puzzle-manager.js"></script>
  <script src="./assets/js/app.js"></script>

  <!-- IMAGE TARGET -->

  <script>

    const onxrloaded = () => {

      console.log('XR LOADED')

      XR8.XrController.configure({

        imageTargetData:[{

          name: 'book',

          type: 'PLANAR',

          imagePath: './assets/targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,

            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })

      console.log('IMAGE TARGET CONFIGURED')
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener(
          'xrloaded',
          onxrloaded
        )

  </script>

<link rel="stylesheet" href="./style.min.css">

</head>

<body>


  <!-- FALLBACK SCREEN -->

  <div id="fallbackScreen">

  <img
    id="fallbackBg"
    src="./assets/splash_bg.jpg">

  <div id="fallbackOverlay"></div>

  <div id="fallbackContent">

    <div id="fallbackTopSpacer"></div>

    <div id="fallbackBranding">

      <img
        id="fallbackTitle"
        src="./assets/title.png"
        alt="The Ghost City">

      <div id="fallbackSubtitle">

        CLASSIFIED ARCHIVE ACCESS

      </div>

    </div>

    <div id="fallbackBottom">

      <div id="fallbackMessage">

        This experience requires a
        supported mobile device

      </div>

      <img
        id="fallbackQR"
        src="./assets/qr.png"
        alt="QR Code">

      <div id="fallbackPrompt">

        Scan to continue

      </div>

      <a
        id="fallbackUrl"
        href="https://ryanpote.com/theghostcity-ar"
        target="_blank">

        https://ryanpote.com/theghostcity-ar

      </a>

    </div>

    <div id="fallbackCredit">

      <a href="https://shaleshshekhar.in" target="_blank" rel="noopener noreferrer">
      created by - <span>Shalesh Shekhar</span>
      </a>

    </div>

  </div>

</div>

  <div id="splashScreen">

  <img
    id="splashBg"
    src="./assets/splash_bg.jpg">

  <div id="splashOverlay"></div>

  <div id="splashContent">

    <div id="topSpacer"></div>

    <div id="brandingBlock">

      <img
        id="titleImage"
        src="./assets/title.png"
        alt="The Ghost City">

      <div id="subTitle">

        CLASSIFIED ARCHIVE ACCESS

      </div>

    </div>

    <div id="middleSpacer"></div>

    <button
      id="startButton"
      disabled>

      <span id="buttonText">

        LOADING

      </span>

      <span id="loadingDots">

        ...

      </span>

    </button>

    <div id="creditText">

      <a href="https://shaleshshekhar.in" target="_blank" rel="noopener noreferrer">
      created by - <span>Shalesh Shekhar</span>
      </a>

    </div>

    <div id="bottomSpacer"></div>

  </div>

</div>



  <!-- STATUS MESSAGE -->

  <div id="statusMessage"></div>
 
  <div id="fadeOverlay"></div>

  <div id="redirectScreen">

    <div id="redirectText"></div>

  </div>

  <!-- SCENE -->

  <a-scene

    xrextras-gesture-detector
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ASSETS -->

    <a-assets>

      <video
        id="introVideo"

        src="./assets/intro_video.mp4"

        preload="none"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"
>
      </video>

      <video
        id="outroVideo"

        src="./assets/outro_video.mp4"

        preload="none"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"
>
      </video>

    </a-assets>
        
    <!-- AMBIENT LIGHT -->

    <a-light

      type="ambient"

      color="#ffffff"

      intensity="2.2">
    </a-light>

    <!-- DIRECTIONAL LIGHT -->

    <a-light

      type="directional"

      color="#ffffff"

      intensity="2.5"

      position="2 4 3">
    </a-light>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- IMAGE TARGET -->

    <xrextras-named-image-target name="book">

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="0.76"
        height="1.147"

        position="0 0 0"

        visible="false">
      </a-video>

      <!-- LOCKER MODEL -->

      <a-entity

        id="lockerModel"

        gltf-model=""

        position="0 0 0"

        rotation="0 -90 0"

        scale="1.25 1.25 1.25"

        visible="false">
      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="0.76"
        height="1.147"

        position="0 0 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

</body>
</html>
