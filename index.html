<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR BOOK</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>

  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- Image Target -->
  <script>
    const onxrloaded = () => {

      XR8.XrController.configure({

        imageTargetData: [{

          name: 'book',
          type: 'PLANAR',

          imagePath: '../assets/Targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,
            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener('xrloaded', onxrloaded)
  </script>

  <!-- Puzzle Logic -->
  <script src="./locker-puzzle.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }

    /* ========================================= */
    /* SPLASH SCREEN */
    /* ========================================= */

    #splashScreen {

      position: fixed;
      inset: 0;

      z-index: 999999;

      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;

      pointer-events: auto;
    }

    #splashContent {
      text-align: center;
      padding: 30px;
      width: 100%;
    }

    #splashTitle {
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 20px;
      letter-spacing: 4px;
    }

    #splashSubtitle {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    #startButton {

      pointer-events: auto;

      border: none;
      outline: none;

      padding: 18px 34px;

      font-size: 18px;
      border-radius: 12px;

      background: white;
      color: black;

      cursor: pointer;

      position: relative;
      z-index: 999999;
    }

    /* ========================================= */
    /* STATUS TEXT */
    /* ========================================= */

    #statusText {

      position: fixed;

      top: 30px;
      left: 50%;

      transform: translateX(-50%);

      z-index: 9999;

      color: white;

      background: rgba(0,0,0,0.75);

      padding: 12px 20px;

      border-radius: 10px;

      font-size: 18px;

      display: none;
    }

  </style>
</head>

<body>

  <!-- ========================================= -->
  <!-- SPLASH SCREEN -->
  <!-- ========================================= -->

  <div id="splashScreen">

    <div id="splashContent">

      <div id="splashTitle">
        ORION
      </div>

      <div id="splashSubtitle">
        Scan the book to begin the experience
      </div>

      <button id="startButton">
        START EXPERIENCE
      </button>

    </div>

  </div>

  <!-- ========================================= -->
  <!-- STATUS -->
  <!-- ========================================= -->

  <div id="statusText">
    Puzzle Solved
  </div>

  <!-- ========================================= -->
  <!-- SCENE -->
  <!-- ========================================= -->

  <a-scene

    xrextras-gesture-detector
    xrextras-almost-there
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ========================================= -->
    <!-- ASSETS -->
    <!-- ========================================= -->

    <a-assets>

      <!-- INTRO VIDEO -->

      <video
        id="introVideo"
        src="assets/intro_video.mp4"
        preload="auto"
        webkit-playsinline
        playsinline
        crossorigin="anonymous"
        muted>
      </video>

      <!-- OUTRO VIDEO -->

      <video
        id="outroVideo"
        src="assets/outro_video.mp4"
        preload="auto"
        webkit-playsinline
        playsinline
        crossorigin="anonymous"
        muted>
      </video>

      <!-- LOCKER MODEL -->

      <a-asset-item
        id="lockerModel"
        src="assets/locker.glb">
      </a-asset-item>

    </a-assets>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- ========================================= -->
    <!-- IMAGE TARGET -->
    <!-- ========================================= -->

    <xrextras-named-image-target name="book">

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

      <!-- LOCKER -->

      <a-entity

        id="lockerRoot"

        gltf-model="#lockerModel"

        position="0 0 -0.3"

        scale="0.825 0.825 0.825"

        visible="false"

        locker-puzzle>
      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="1.5"
        height="0.85"

        position="0 0.3 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

  <!-- ========================================= -->
  <!-- MAIN EXPERIENCE SCRIPT -->
  <!-- ========================================= -->

  <script>

  console.log('==============================')
  console.log('APP SCRIPT STARTED')
  console.log('==============================')

  // =========================================
  // ELEMENT REFERENCES
  // =========================================

  const splashScreen =
    document.querySelector('#splashScreen')

  const startButton =
    document.querySelector('#startButton')

  const introVideo =
    document.querySelector('#introVideo')

  const outroVideo =
    document.querySelector('#outroVideo')

  const introPlane =
    document.querySelector('#introPlane')

  const outroPlane =
    document.querySelector('#outroPlane')

  const lockerRoot =
    document.querySelector('#lockerRoot')

  const statusText =
    document.querySelector('#statusText')

  const imageTarget =
    document.querySelector('xrextras-named-image-target')

  console.log('ELEMENT REFERENCES COMPLETE')

  console.log('splashScreen:', splashScreen)
  console.log('startButton:', startButton)
  console.log('introVideo:', introVideo)
  console.log('outroVideo:', outroVideo)
  console.log('imageTarget:', imageTarget)

  // =========================================
  // GLOBAL STATE
  // =========================================

  let experienceStarted = false

  let introCompleted = false
  let outroStarted = false

  window.puzzleTrackingActive = false

  console.log('INITIAL STATE READY')

  // =========================================
  // STATUS MESSAGE
  // =========================================

  function showMessage(text) {

    console.log('SHOW MESSAGE:', text)

    statusText.innerText = text

    statusText.style.display = 'block'

    setTimeout(() => {

      statusText.style.display = 'none'

      console.log('MESSAGE HIDDEN')

    }, 2500)
  }

  // =========================================
  // DEBUG TOUCHES
  // =========================================

  document.body.addEventListener('touchstart', () => {

    console.log('BODY TOUCH DETECTED')

  })

  document.body.addEventListener('click', () => {

    console.log('BODY CLICK DETECTED')

  })

  // =========================================
  // START EXPERIENCE
  // =========================================

  const unlockExperience = async (event) => {

    console.log('==============================')
    console.log('unlockExperience CALLED')
    console.log('==============================')

    console.log('EVENT:', event)

    if (experienceStarted) {

      console.log('BLOCKED: experience already started')

      return
    }

    experienceStarted = true

    console.log('experienceStarted = TRUE')

    startButton.innerText = 'LOADING...'

    console.log('BUTTON TEXT CHANGED')

    try {

      console.log('ATTEMPTING MEDIA UNLOCK')

      introVideo.muted = false
      outroVideo.muted = false

      console.log('VIDEOS UNMUTED')

      await introVideo.play()

      console.log('INTRO VIDEO PLAY SUCCESS')

      introVideo.pause()

      console.log('INTRO VIDEO PAUSED')

      introVideo.currentTime = 0

      console.log('INTRO VIDEO RESET')

    } catch (e) {

      console.log('MEDIA UNLOCK ERROR:')
      console.error(e)
    }

    console.log('ATTEMPTING TO HIDE SPLASH')

    splashScreen.style.display = 'none'

    console.log('SPLASH DISPLAY SET TO NONE')

    console.log(
      'CURRENT DISPLAY VALUE:',
      splashScreen.style.display
    )

    window.puzzleTrackingActive = true

    console.log('PUZZLE TRACKING ENABLED')

    console.log('==============================')
    console.log('unlockExperience COMPLETE')
    console.log('==============================')
  }

  // =========================================
  // BUTTON EVENTS
  // =========================================

  console.log('REGISTERING BUTTON EVENTS')

  startButton.addEventListener('click', (e) => {

    console.log('BUTTON CLICK EVENT FIRED')

    unlockExperience(e)
  })

  startButton.addEventListener('touchstart', (e) => {

    console.log('BUTTON TOUCHSTART EVENT FIRED')

    unlockExperience(e)
  })

  console.log('BUTTON EVENTS REGISTERED')

  // =========================================
  // TARGET FOUND
  // =========================================

  imageTarget.addEventListener('targetFound', () => {

    console.log('==============================')
    console.log('TARGET FOUND')
    console.log('==============================')

    console.log(
      'experienceStarted:',
      experienceStarted
    )

    if (!experienceStarted) {

      console.log('TARGET FOUND BLOCKED')

      return
    }

    window.puzzleTrackingActive = true

    console.log('TRACKING ENABLED')

    // INTRO
    if (!introCompleted) {

      console.log('STARTING INTRO VIDEO')

      introPlane.setAttribute(
        'visible',
        true
      )

      introVideo.play()
        .then(() => {

          console.log('INTRO VIDEO PLAYING')
        })
        .catch((err) => {

          console.log('INTRO VIDEO PLAY FAILED')
          console.error(err)
        })
    }

    // OUTRO
    if (
      introCompleted &&
      outroStarted
    ) {

      console.log('RESUMING OUTRO VIDEO')

      outroVideo.play()
        .then(() => {

          console.log('OUTRO VIDEO RESUMED')
        })
        .catch((err) => {

          console.log('OUTRO VIDEO RESUME FAILED')
          console.error(err)
        })
    }
  })

  // =========================================
  // TARGET LOST
  // =========================================

  imageTarget.addEventListener('targetLost', () => {

    console.log('==============================')
    console.log('TARGET LOST')
    console.log('==============================')

    introVideo.pause()

    outroVideo.pause()

    console.log('VIDEOS PAUSED')

    window.puzzleTrackingActive = false

    console.log('TRACKING DISABLED')
  })

  // =========================================
  // INTRO ENDED
  // =========================================

  introVideo.addEventListener('ended', () => {

    console.log('==============================')
    console.log('INTRO VIDEO ENDED')
    console.log('==============================')

    introCompleted = true

    console.log('introCompleted = TRUE')

    introPlane.setAttribute(
      'visible',
      false
    )

    console.log('INTRO PLANE HIDDEN')

    lockerRoot.setAttribute(
      'visible',
      true
    )

    console.log('LOCKER SHOWN')
  })

  // =========================================
  // ROW SOLVED
  // =========================================

  window.onPuzzleSolved = (type) => {

    console.log('ROW SOLVED:', type)

    if (type === 'top') {

      showMessage(
        'Dr. Ringuet Code Solved'
      )
    }

    if (type === 'bottom') {

      showMessage(
        'Saran Security Code Solved'
      )
    }
  }

  // =========================================
  // ALL SOLVED
  // =========================================

  window.onAllPuzzleSolved = () => {

    console.log('==============================')
    console.log('ALL PUZZLES SOLVED')
    console.log('==============================')

    showMessage('Locker Unlocked')

    lockerRoot.setAttribute(
      'visible',
      false
    )

    console.log('LOCKER HIDDEN')

    outroStarted = true

    console.log('outroStarted = TRUE')

    outroPlane.setAttribute(
      'visible',
      true
    )

    console.log('OUTRO PLANE SHOWN')

    outroVideo.play()
      .then(() => {

        console.log('OUTRO VIDEO PLAYING')
      })
      .catch((err) => {

        console.log('OUTRO VIDEO FAILED')
        console.error(err)
      })
  }

  // =========================================
  // OUTRO COMPLETE
  // =========================================

  outroVideo.addEventListener('ended', () => {

    console.log('==============================')
    console.log('OUTRO VIDEO ENDED')
    console.log('REDIRECTING')
    console.log('==============================')

    window.location.href =
      'https://www.ryanpote.com/memento-mori'
  })

  // =========================================
  // VIDEO DEBUG
  // =========================================

  introVideo.addEventListener('play', () => {

    console.log('INTRO VIDEO PLAY EVENT')
  })

  introVideo.addEventListener('pause', () => {

    console.log('INTRO VIDEO PAUSE EVENT')
  })

  introVideo.addEventListener('error', (e) => {

    console.log('INTRO VIDEO ERROR')
    console.error(e)
  })

  outroVideo.addEventListener('error', (e) => {

    console.log('OUTRO VIDEO ERROR')
    console.error(e)
  })

  console.log('==============================')
  console.log('SCRIPT INITIALIZATION COMPLETE')
  console.log('WAITING FOR USER')
  console.log('==============================')

</script>

</body>
</html>
