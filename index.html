<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Ghost City AR Experience</title>

  <!-- 8th Wall -->
  <script src="https://cdn.8thwall.com/web/aframe/8frame-1.3.0.min.js"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
 
  <!-- XR Engine -->
  <script async src="./engine/xr.js" data-preload-chunks="slam"></script>

  <!-- APP SCRIPTS -->

  <script src="./assets/js/audio-manager.js"></script>
  <script src="./assets/js/ui-manager.js"></script>
  <script src="./assets/js/tracking-manager.js"></script>
  <script src="./assets/js/intro-manager.js"></script>
  <script src="./assets/js/interaction-manager.js"></script>
  <script src="./assets/js/puzzle-manager.js"></script>
  <script src="./assets/js/app.js"></script>

  <!-- IMAGE TARGET -->

  <script>

    const onxrloaded = () => {

      console.log('XR LOADED')

      XR8.XrController.configure({

        imageTargetData:[{

          name: 'book',

          type: 'PLANAR',

          imagePath: './assets/targets/ghost_book_luminance.jpg',

          properties: {

            top: 184,
            left: 0,

            width: 2083,
            height: 2777,

            isRotated: false,

            originalWidth: 2083,
            originalHeight: 3144
          }
        }]
      })

      console.log('IMAGE TARGET CONFIGURED')
    }

    window.XR8
      ? onxrloaded()
      : window.addEventListener(
          'xrloaded',
          onxrloaded
        )

  </script>

  <style>

    body {

      margin: 0;
      overflow: hidden;
      background: black;

      font-family: Arial, sans-serif;
    }

    /* =========================================
      ENTRY BACKGROUND
    ========================================= */
    #entryBranding {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      height: 75vh;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      align-items: center;

      padding-bottom: 12vh;

      box-sizing: border-box;

      z-index: 999999;

      pointer-events: none;

      opacity: 0;

      animation:
        brandingReveal
        0.8s ease forwards;

      transition:
        height 0.8s cubic-bezier(
          .22,.61,.36,1
        ),
        padding-bottom 0.8s cubic-bezier(
          .22,.61,.36,1
        );
    }

    #entryBranding.compact {

      height: 50vh;

      padding-bottom: 4vh;
    }

    #entryTitle {

      height: 34vh;

      width: auto;

      max-width: 80vw;

      transition:
        height 0.8s cubic-bezier(
          .22,.61,.36,1
        );
    }

    #entryBranding.compact #entryTitle {

      height: 22vh;
    }

    #entrySubtitle {

      margin-top: 2vh;

      color: #B09E75;

      font-family:
        'IBM Plex Mono',
        monospace;

      letter-spacing: 0.18em;

      font-size:
        clamp(14px, 2vh, 20px);

      transition:
        font-size 0.8s cubic-bezier(
          .22,.61,.36,1
        );

    }

    #entryBranding.compact #entrySubtitle {

      font-size:
        clamp(12px, 1.6vh, 16px);
    }

    @keyframes brandingReveal {

      from {

        opacity: 0;

        transform:
          translateY(12px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }

    #entryBackground {

      position: fixed;

      inset: 0;

      z-index: 999998;

      overflow: hidden;

      background: black;
    }

    #entryBlack {

      position: absolute;

      inset: 0;

      background: black;

      z-index: 1;
    }

    #entryBg {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      z-index: 2;

      animation:
        entryBgReveal
        1s ease forwards;
    }

    @keyframes entryBgReveal {

      to {

        opacity: 1;
      }
    }

    #debugPanel {

      position: fixed;

      left: 10px;
      right: 10px;
      bottom: 110px;

      max-height: 260px;

      overflow-y: auto;

      z-index: 999999;

      padding: 12px;

      border-radius: 12px;

      background:
        rgba(0,0,0,0.82);

      color:
        #6CFF9F;

      font-size: 12px;

      line-height: 1.45;

      font-family:
        monospace;

      pointer-events: none;

      white-space: pre-wrap;
    }

    /* =========================================
      FALLBACK SCREEN
    ========================================= */
   #fallbackContent {

      width:100%;
      height:100%;

      display:flex;

      flex-direction:column;

      justify-content:flex-end;

      align-items:center;

      text-align:center;

      padding-bottom:10vh;

      padding-top: 25vh;

      opacity: 0;

      transition:
        padding-top 0.8s cubic-bezier(
          .22,.61,.36,1
        ),
        opacity 0.8s ease;

      box-sizing:border-box;
    }

    #fallbackContent.expanded {

      padding-top: 0;

      opacity: 1;
    }

    #fallbackMessage {

      margin-top: 3vh;

      color: #B09E75;

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size:
        clamp(15px, 1.8vh, 19px);

      line-height: 1.7;

      letter-spacing: 0.03em;

      opacity: 0.95;
    }

    #fallbackQR {

      width: min(28vh, 240px);

      height: auto;

      margin-top: 5vh;

      border-radius: 12px;

      box-shadow:
        0 0 20px
        rgba(176,158,117,0.12);
    }

    #fallbackPrompt {

      margin-top: 2.5vh;

      color: #B09E75;

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size:
        clamp(13px, 1.5vh, 16px);

      letter-spacing: 0.14em;

      text-transform: uppercase;

      opacity: 0.9;
    }

    #fallbackUrl {

      margin-top: 1.4vh;

      color:
        rgba(176,158,117,0.7);

      text-decoration: none;

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size:
        clamp(12px, 1.2vh, 14px);

      letter-spacing: 0.05em;
    }

    #fallbackScreen {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 999999;

      display: none;

      justify-content: center;
      align-items: center;
    }

    #fallbackMessage,
    #fallbackQR,
    #fallbackPrompt,
    #fallbackUrl {

      opacity: 0;

      transform:
        translateY(16px);

      animation:
        fallbackReveal
        0.8s ease forwards;
    }

    #fallbackMessage {

      animation-delay: 0.35s;
    }

    #fallbackQR {

      animation-delay: 0.55s;
    }

    #fallbackPrompt {

      animation-delay: 0.75s;
    }

    #fallbackUrl {

      animation-delay: 0.95s;
    }

    @keyframes fallbackReveal {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }

    /* =========================================
      SPLASH SCREEN
    ========================================= */

    #splashScreen {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      z-index: 999999;

      display: none;

      justify-content: center;
      align-items: center;
    }

    #splashContent {

      width:100%;
      height:100%;

      display:flex;

      flex-direction:column;

      justify-content:flex-end;

      align-items:center;

      padding-bottom:8vh;

      box-sizing:border-box;
    }

    /* =========================================
      BUTTON
    ========================================= */

    #startButton {

      border:
        1.5px solid
        rgba(176,158,117,0.9);

      background:
        transparent;

      color:
        #b09e75;

      padding:
        18px 42px;

      border-radius: 10px;

      font-size:
        clamp(16px, 2.1vh, 22px);

      letter-spacing: 0.12em;

      text-transform: uppercase;

      cursor: pointer;

      opacity: 0;

      transform:
        translateY(18px);

      animation:
        ctaReveal 0.8s ease forwards;

      animation-delay: 0.75s;

      transition:
        transform 0.18s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

      box-shadow:
        0 0 12px
        rgba(176,158,117,0.12);
    }
        
    /* =========================================
      BUTTON LOADING
    ========================================= */

    #buttonText {

      display: inline-block;

      min-width: 11ch;
    }

    #loadingDots {

      display: inline-block;

      width: 3ch;

      text-align: left;
    }

    /* =========================================
      DISABLED BUTTON
    ========================================= */

    #startButton:disabled {

      opacity: 0.72;

      cursor: default;
    }

    @keyframes ctaReveal {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }

    #startButton:active {

      transform:
        scale(0.97);

      background:
        rgba(176,158,117,0.08);

      box-shadow:
        0 0 18px
        rgba(176,158,117,0.22);
    }


    /* =========================================
       STATUS UI
    ========================================= */

    #statusMessage {

      position: fixed;

      left: 50%;
      bottom: 40px;

      transform: translateX(-50%);

      z-index: 99999;

      padding:
        14px 24px;

      border-radius: 14px;

      background:
        rgba(10,15,20,0.72);

      border:
        1px solid
        rgba(180,220,255,0.25);

      color:
        rgba(220,240,255,0.92);

      font-size: 16px;

      letter-spacing: 0.05em;

      opacity: 0;

      transition: opacity 0.3s ease;

      pointer-events: none;
    }

    #statusMessage.visible {

      opacity: 1;
    }
       
    #fadeOverlay {

      position: fixed;

      inset: 0;

      background: black;

      opacity: 0;

      pointer-events: none;

      z-index: 9999999;

      transition:
        opacity 1s ease;
    }

    #fadeOverlay.visible {

      opacity: 1;
    }

    
    /* =========================================
      REDIRECT SCREEN
    ========================================= */

    #redirectScreen {

      position: fixed;

      inset: 0;

      z-index: 99999999;

      background: black;

      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0;

      pointer-events: none;

      transition:
        opacity 0.8s ease;
    }

    #redirectScreen.visible {

      opacity: 1;
    }

    #redirectText {

      color: #8A6D2C;

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size:
        clamp(20px, 2.6vw, 42px);

      text-align: center;

      padding:
        0 8vw;

      line-height: 1.5;

      letter-spacing: 0.03em;

      text-shadow:
        0 0 10px
        rgba(138,109,44,0.18);
    }

    #redirectCursor {

      animation:
        cursorPulse 0.8s infinite;
    }

    @keyframes cursorPulse {

      0% {

        opacity: 1;
      }

      50% {

        opacity: 0;
      }

      100% {

        opacity: 1;
      }
    }
    
    /* =========================================
      SPLASH CREDIT
    ========================================= */

    #creditText {

      position: fixed;

      left: 50%;

      bottom: 4vh;

      transform:
        translateX(-50%);

      z-index: 1000001;

      pointer-events: auto;

      color:
        rgba(176,158,117,0.42);

      font-family:
        'IBM Plex Mono',
        monospace;

      font-size:
        clamp(10px, 1.15vh, 13px);

      letter-spacing: 0.06em;

      text-align: center;

      opacity: 0;

      animation:
        creditReveal 1s ease forwards;

      animation-delay: 1.15s;
    }
    
    #creditText a {

      color:
        rgba(176,158,117,0.62);

      text-decoration: none;

      transition:
        opacity 0.25s ease,
        color 0.25s ease;
    }

    #creditText a:active {

      opacity: 0.8;
    }

    #creditText a:hover {

      color:
        rgba(176,158,117,0.9);
    }

    @keyframes creditReveal {

      to {

        opacity: 1;
      }
    }

    #entryBranding,
    #fallbackContent,
    #splashContent {

      box-sizing:border-box;
    }

    #entryBackground {

      transition:
        opacity 0.5s ease;
    }

    #entryBackground.hidden {

      opacity: 0;

      pointer-events: none;
    }

  </style>
</head>

<body>

  <div id="entryBackground">

    <div id="entryBlack"></div>

    <img
      id="entryBg"
      src="./assets/splash_bg.jpg">

      <div id="entryBranding">

        <img
          id="entryTitle"
          src="./assets/title.png"
          alt="The Ghost City">

        <div id="entrySubtitle">
          CLASSIFIED ARCHIVE ACCESS
        </div>

      </div>

      <div id="creditText">

        created by - 
        <a
          href="https://shaleshshekhar.in"
          target="_blank"
          rel="noopener noreferrer">
          Shalesh Shekhar
        </a>

</div>
  </div>

  <!-- FALLBACK SCREEN -->

  <div id="fallbackScreen">

    <div id="fallbackContent">

      <div id="fallbackMessage">

        This experience requires a
        supported mobile device

      </div>

      <img
        id="fallbackQR"
        src="./assets/qr.png"
        alt="QR Code">

      <div id="fallbackPrompt">

        Scan to continue

      </div>

      <a
        id="fallbackUrl"
        href="https://example.com"
        target="_blank">

        https://example.com

      </a>

    </div>

  </div>

  <!-- SPLASH -->

  <div id="splashScreen">

    <div id="splashContent">

      <button
        id="startButton"
        disabled>

        <span id="buttonText">
          LOADING
        </span>

        <span id="loadingDots">
          ...
        </span>

      </button>

    </div>

  </div>



  <!-- STATUS MESSAGE -->

  <div id="statusMessage"></div>
 
  <div id="fadeOverlay"></div>

  <div id="redirectScreen">

    <div id="redirectText"></div>

  </div>

  <!-- SCENE -->

  <a-scene

    xrextras-gesture-detector
    xrextras-loading
    xrextras-runtime-error

    xrweb="disableWorldTracking: true">

    <!-- ASSETS -->

    <a-assets>

      <video
        id="introVideo"

        src="./assets/intro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"
>
      </video>

      <video
        id="outroVideo"

        src="./assets/outro_video.mp4"

        preload="auto"

        playsinline
        webkit-playsinline

        crossorigin="anonymous"
>
      </video>

      <a-asset-item

        id="lockerAsset"

        src="./assets/locker.glb">
      </a-asset-item>

    </a-assets>
        
    <!-- AMBIENT LIGHT -->

    <a-light

      type="ambient"

      color="#ffffff"

      intensity="2.2">
    </a-light>

    <!-- DIRECTIONAL LIGHT -->

    <a-light

      type="directional"

      color="#ffffff"

      intensity="2.5"

      position="2 4 3">
    </a-light>

    <!-- CAMERA -->

    <a-camera position="0 4 10"></a-camera>

    <!-- IMAGE TARGET -->

    <xrextras-named-image-target name="book">

      <!-- INTRO VIDEO -->

      <a-video

        id="introPlane"

        src="#introVideo"

        width="0.76"
        height="1.147"

        position="0 0 0"

        visible="false">
      </a-video>

      <!-- LOCKER MODEL -->

      <a-entity

        id="lockerModel"

        gltf-model="#lockerAsset"

        position="0 0 0"

        rotation="0 -90 0"

        scale="1.25 1.25 1.25"

        visible="false">
      </a-entity>

      <!-- OUTRO VIDEO -->

      <a-video

        id="outroPlane"

        src="#outroVideo"

        width="0.76"
        height="1.147"

        position="0 0 0"

        visible="false">
      </a-video>

    </xrextras-named-image-target>

  </a-scene>

</body>
</html>
